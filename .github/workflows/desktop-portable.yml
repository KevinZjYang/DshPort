name: Release portable build

on:
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: 可选，上游 tag、branch 或 commit
        required: false
      version:
        description: 可选，DshPort 发布版本，例如 0.1.0
        required: false
      force:
        description: 即使同一上游版本已经发布也重新构建
        required: false
        default: 'false'
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: write

jobs:
  detect-upstream:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.detect.outputs.should_build }}
      upstream_ref: ${{ steps.detect.outputs.upstream_ref }}
      upstream_version: ${{ steps.detect.outputs.upstream_version }}
      release_tag: ${{ steps.detect.outputs.release_tag }}
      release_title: ${{ steps.detect.outputs.release_title }}
      upstream_url: ${{ steps.detect.outputs.upstream_url }}
      previous_tag: ${{ steps.detect.outputs.previous_tag }}
      prev_harness_version: ${{ steps.detect.outputs.prev_harness_version }}
    steps:
      - id: detect
        uses: actions/github-script@v8
        with:
          script: |
            const upstreamOwner = 'deepseek-ai'
            const upstreamRepo = 'deepseek-harness'
            const forcedRef = '${{ github.event.inputs.upstream_ref }}'
            const forcedDshPortVersion = '${{ github.event.inputs.version }}'
            const force = '${{ github.event.inputs.force }}' === 'true'

            let upstreamRef = forcedRef
            let upstreamVersion = ''
            let upstreamUrl = `https://github.com/${upstreamOwner}/${upstreamRepo}`

            if (!upstreamRef) {
              // The runtime is built from the @deepseek-ai/dsh npm package, so the npm
              // registry is the source of truth for the upstream version. npm may publish
              // versions (e.g. 0.1.0-rc.6) without a matching git release commit or tag.
              try {
                const response = await fetch('https://registry.npmjs.org/-/package/@deepseek-ai/dsh/dist-tags')
                if (response.ok) {
                  const distTags = await response.json()
                  const latest = distTags.latest
                  if (latest) {
                    upstreamVersion = String(latest)
                    upstreamUrl = `https://www.npmjs.com/package/@deepseek-ai/dsh/v/${upstreamVersion}`
                    console.log(`Detected upstream version from npm: ${upstreamVersion}`)
                  }
                }
              } catch (error) {
                console.warn(`npm registry lookup failed: ${error.message}`)
              }

              // Resolve a git ref for the detected version: matching tag first.
              if (upstreamVersion) {
                for (const tag of [upstreamVersion, `v${upstreamVersion}`]) {
                  try {
                    const tagRef = await github.rest.git.getRef({
                      owner: upstreamOwner,
                      repo: upstreamRepo,
                      ref: `tags/${tag}`,
                    })
                    upstreamRef = tagRef.data.object.sha
                    upstreamUrl = `https://github.com/${upstreamOwner}/${upstreamRepo}/tree/${tag}`
                    break
                  } catch (error) {
                    if (error.status !== 404) throw error
                  }
                }
              }

              // Fall back to a GitHub Release, then a release(dsh): commit, then master.
              if (!upstreamRef) {
                try {
                  const latest = await github.rest.repos.getLatestRelease({
                    owner: upstreamOwner,
                    repo: upstreamRepo,
                  })
                  upstreamRef = latest.data.tag_name
                  upstreamVersion = upstreamVersion || latest.data.tag_name.replace(/^v/, '')
                  upstreamUrl = latest.data.html_url
                } catch (error) {
                  if (error.status !== 404) throw error
                  const commits = await github.paginate(github.rest.repos.listCommits, {
                    owner: upstreamOwner,
                    repo: upstreamRepo,
                    sha: 'master',
                    per_page: 100,
                  })
                  const releaseCommit = upstreamVersion
                    ? commits.find(commit => {
                        const firstLine = commit.commit.message.split('\n')[0] || ''
                        const match = firstLine.match(/^release\(dsh\):\s*([^\s]+)/i)
                        return match && match[1] === upstreamVersion
                      })
                    : commits.find(commit =>
                        /^release\(dsh\):\s*([^\s]+)/i.test(commit.commit.message.split('\n')[0] || ''),
                      )
                  if (releaseCommit) {
                    const firstLine = releaseCommit.commit.message.split('\n')[0]
                    upstreamVersion = upstreamVersion || firstLine.match(/^release\(dsh\):\s*([^\s]+)/i)[1]
                    upstreamRef = releaseCommit.sha
                    upstreamUrl = releaseCommit.html_url
                  } else if (!upstreamVersion) {
                    core.setFailed('No upstream GitHub Release or release(dsh): commit was found.')
                    return
                  } else {
                    // No tag or release commit matches the npm version; pin to master HEAD.
                    const head = await github.rest.repos.getCommit({
                      owner: upstreamOwner,
                      repo: upstreamRepo,
                      ref: 'master',
                    })
                    upstreamRef = head.data.sha
                    upstreamUrl = head.data.html_url
                  }
                }
              }
            }

            if (!upstreamVersion) {
              const commit = await github.rest.repos.getCommit({
                owner: upstreamOwner,
                repo: upstreamRepo,
                ref: upstreamRef,
              })
              const firstLine = commit.data.commit.message.split('\n')[0]
              const match = firstLine.match(/^release\(dsh\):\s*([^\s]+)/i)
              upstreamVersion = match ? match[1] : upstreamRef
              upstreamUrl = commit.data.html_url
            }

            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            })

            const alreadyReleased = releases.some(release =>
              release.body?.includes(`上游版本：${upstreamVersion}`) ||
              release.body?.includes(`上游引用：${upstreamRef}`),
            )

            // Version history comes from git tags as well as releases: releases may be
            // cleaned up (deleted) while tags remain, and the next version must never
            // go backwards.
            const tags = await github.paginate(github.rest.repos.listTags, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            })
            const versionStrings = [...new Set([
              ...releases.map(release => release.tag_name),
              ...tags.map(tag => tag.name),
            ])]
            const stableVersions = versionStrings
              .map(tag => tag.match(/^v(\d+)\.(\d+)\.(\d+)$/))
              .filter(Boolean)
              .map(match => match.slice(1).map(Number))
              .sort((a, b) => a[0] - b[0] || a[1] - b[1] || a[2] - b[2])

            let dshPortVersion = forcedDshPortVersion.replace(/^v/, '')
            if (!dshPortVersion) {
              if (stableVersions.length === 0) {
                core.setFailed('Cannot determine the next DshPort version (no release or tag history). Pass the version input explicitly.')
                return
              }
              const latest = stableVersions.at(-1)
              dshPortVersion = `${latest[0]}.${latest[1]}.${latest[2] + 1}`
            }

            const releaseTag = `v${dshPortVersion}`
            let tagExists = false
            try {
              await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag: releaseTag,
              })
              tagExists = true
            } catch (error) {
              if (error.status !== 404) throw error
            }

            core.setOutput('should_build', String(force || (!alreadyReleased && !tagExists)))
            core.setOutput('upstream_ref', upstreamRef)
            core.setOutput('upstream_version', upstreamVersion)
            core.setOutput('release_tag', releaseTag)
            core.setOutput('release_title', `DshPort ${releaseTag}`)
            core.setOutput('upstream_url', upstreamUrl)

            // Previous release tag used to build the changelog section in the
            // release body: the newest stable tag at or below this release.
            // On a fresh release that tag does not exist yet, so "at or below"
            // resolves to the previous release; on a forced rebuild of an
            // existing tag it resolves to that tag itself, showing the commits
            // since it was last built.
            const thisVersion = dshPortVersion.split('.').map(Number)
            const previousStable = stableVersions
              .filter(v => v[0] < thisVersion[0] || (v[0] === thisVersion[0] && v[1] < thisVersion[1]) || (v[0] === thisVersion[0] && v[1] === thisVersion[1] && v[2] <= thisVersion[2]))
              .at(-1)
            core.setOutput('previous_tag', previousStable ? `v${previousStable.join('.')}` : '')

            // Previous Harness version, read from the newest previously released
            // body (strictly below this release). Releases record the upstream
            // version as "上游版本：x.y.z", which is the bundled @deepseek-ai/dsh
            // package version — the Harness runtime this release ships.
            const prevHarnessRelease = releases
              .map(release => ({ release, version: (release.tag_name || '').match(/^v(\d+)\.(\d+)\.(\d+)$/u) }))
              .filter(entry => entry.version !== null)
              .map(entry => ({ release: entry.release, version: entry.version.slice(1).map(Number) }))
              .filter(entry =>
                entry.version[0] < thisVersion[0] ||
                (entry.version[0] === thisVersion[0] && entry.version[1] < thisVersion[1]) ||
                (entry.version[0] === thisVersion[0] && entry.version[1] === thisVersion[1] && entry.version[2] < thisVersion[2]),
              )
              .sort((a, b) => b.version[0] - a.version[0] || b.version[1] - a.version[1] || b.version[2] - a.version[2])
              .at(0)
            const prevHarnessVersion = (prevHarnessRelease?.release.body || '').match(/上游版本：\s*([0-9][^\s\r\n]*)/u)?.[1] || ''
            core.setOutput('prev_harness_version', prevHarnessVersion)

  windows-x64:
    needs: detect-upstream
    if: needs.detect-upstream.outputs.should_build == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.14.0'
          cache: pnpm
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: node scripts/build-runtime.mjs
        env:
          DSH_SOURCE_REF: ${{ needs.detect-upstream.outputs.upstream_ref }}
          DSH_PACKAGE_VERSION: ${{ needs.detect-upstream.outputs.upstream_version }}
      - run: node scripts/package.mjs --zip
        env:
          DSHPORT_VERSION: ${{ needs.detect-upstream.outputs.release_tag }}
      - run: npm run smoke:package
      - name: 生成更新日志
        shell: bash
        run: |
          PREV="${{ needs.detect-upstream.outputs.previous_tag }}"
          if [ -n "$PREV" ]; then
            RANGE="${PREV}..HEAD"
          else
            RANGE="HEAD"
          fi
          {
            echo "DshPort Windows 便携版自动构建。"
            echo ""
            echo "上游项目：${{ needs.detect-upstream.outputs.upstream_url }}"
            echo "上游版本：${{ needs.detect-upstream.outputs.upstream_version }}"
            echo "上游引用：${{ needs.detect-upstream.outputs.upstream_ref }}"
            echo ""
            echo "## 更新内容"
            echo ""
            HARNESS_PREV="${{ needs.detect-upstream.outputs.prev_harness_version }}"
            HARNESS_CUR="${{ needs.detect-upstream.outputs.upstream_version }}"
            if [ -n "$HARNESS_PREV" ] && [ "$HARNESS_PREV" != "$HARNESS_CUR" ]; then
              echo "- Harness 版本：$HARNESS_PREV → $HARNESS_CUR"
            elif [ -n "$HARNESS_PREV" ] && [ "$HARNESS_PREV" = "$HARNESS_CUR" ]; then
              echo "- Harness 版本：$HARNESS_CUR（与上次发布相同）"
            elif [ -n "$HARNESS_CUR" ]; then
              echo "- Harness 版本：$HARNESS_CUR"
            fi
            echo ""
            if [ -n "$PREV" ]; then
              echo "自上次发布（$PREV）以来的变更："
            else
              echo "首次发布："
            fi
            echo ""
            LOG="$(git log --no-merges --pretty=format:'- [%h](https://github.com/${{ github.repository }}/commit/%h) %s' "$RANGE")"
            if [ -n "$LOG" ]; then
              echo "$LOG"
            else
              echo "本次没有新的 DshPort 提交（可能仅上游版本更新）。"
            fi
            echo ""
            echo "下载说明："
            echo "- DshPort-win-x64.zip：完整 Windows x64 便携包，首次使用下载这个"
            echo "- harness-runtime.zip：仅 Harness 运行时更新包，供后续增量更新使用"
            echo "- SHA256SUMS.txt：SHA-256 校验文件"
          } > release-body.md
      - uses: actions/upload-artifact@v4
        with:
          name: DshPort-win-x64
          path: |
            dist-exe/desktop/DshPort-win-x64.zip
            dist-exe/desktop/harness-runtime.zip
            dist-exe/desktop/SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.detect-upstream.outputs.release_tag }}
          name: ${{ needs.detect-upstream.outputs.release_title }}
          prerelease: false
          body_path: release-body.md
          files: |
            dist-exe/desktop/DshPort-win-x64.zip
            dist-exe/desktop/harness-runtime.zip
            dist-exe/desktop/SHA256SUMS.txt
