name: Release portable build

on:
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: 可选，上游 tag、branch 或 commit
        required: false
      version:
        description: 可选，DshPort 发布版本，例如 0.1.0
        required: false
      force:
        description: 即使同一上游版本已经发布也重新构建
        required: false
        default: 'false'
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: write

jobs:
  detect-upstream:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.detect.outputs.should_build }}
      upstream_ref: ${{ steps.detect.outputs.upstream_ref }}
      upstream_version: ${{ steps.detect.outputs.upstream_version }}
      release_tag: ${{ steps.detect.outputs.release_tag }}
      release_title: ${{ steps.detect.outputs.release_title }}
      upstream_url: ${{ steps.detect.outputs.upstream_url }}
    steps:
      - id: detect
        uses: actions/github-script@v8
        with:
          script: |
            const upstreamOwner = 'deepseek-ai'
            const upstreamRepo = 'deepseek-harness'
            const forcedRef = '${{ github.event.inputs.upstream_ref }}'
            const forcedDshPortVersion = '${{ github.event.inputs.version }}'
            const force = '${{ github.event.inputs.force }}' === 'true'

            let upstreamRef = forcedRef
            let upstreamVersion = ''
            let upstreamUrl = `https://github.com/${upstreamOwner}/${upstreamRepo}`

            if (!upstreamRef) {
              // The runtime is built from the @deepseek-ai/dsh npm package, so the npm
              // registry is the source of truth for the upstream version. npm may publish
              // versions (e.g. 0.1.0-rc.6) without a matching git release commit or tag.
              try {
                const response = await fetch('https://registry.npmjs.org/-/package/@deepseek-ai/dsh/dist-tags')
                if (response.ok) {
                  const distTags = await response.json()
                  const latest = distTags.latest
                  if (latest) {
                    upstreamVersion = String(latest)
                    upstreamUrl = `https://www.npmjs.com/package/@deepseek-ai/dsh/v/${upstreamVersion}`
                    console.log(`Detected upstream version from npm: ${upstreamVersion}`)
                  }
                }
              } catch (error) {
                console.warn(`npm registry lookup failed: ${error.message}`)
              }

              // Resolve a git ref for the detected version: matching tag first.
              if (upstreamVersion) {
                for (const tag of [upstreamVersion, `v${upstreamVersion}`]) {
                  try {
                    const tagRef = await github.rest.repos.getRef({
                      owner: upstreamOwner,
                      repo: upstreamRepo,
                      ref: `tags/${tag}`,
                    })
                    upstreamRef = tagRef.data.object.sha
                    upstreamUrl = `https://github.com/${upstreamOwner}/${upstreamRepo}/tree/${tag}`
                    break
                  } catch (error) {
                    if (error.status !== 404) throw error
                  }
                }
              }

              // Fall back to a GitHub Release, then a release(dsh): commit, then master.
              if (!upstreamRef) {
                try {
                  const latest = await github.rest.repos.getLatestRelease({
                    owner: upstreamOwner,
                    repo: upstreamRepo,
                  })
                  upstreamRef = latest.data.tag_name
                  upstreamVersion = upstreamVersion || latest.data.tag_name.replace(/^v/, '')
                  upstreamUrl = latest.data.html_url
                } catch (error) {
                  if (error.status !== 404) throw error
                  const commits = await github.paginate(github.rest.repos.listCommits, {
                    owner: upstreamOwner,
                    repo: upstreamRepo,
                    sha: 'master',
                    per_page: 100,
                  })
                  const releaseCommit = upstreamVersion
                    ? commits.find(commit => {
                        const firstLine = commit.commit.message.split('\n')[0] || ''
                        const match = firstLine.match(/^release\(dsh\):\s*([^\s]+)/i)
                        return match && match[1] === upstreamVersion
                      })
                    : commits.find(commit =>
                        /^release\(dsh\):\s*([^\s]+)/i.test(commit.commit.message.split('\n')[0] || ''),
                      )
                  if (releaseCommit) {
                    const firstLine = releaseCommit.commit.message.split('\n')[0]
                    upstreamVersion = upstreamVersion || firstLine.match(/^release\(dsh\):\s*([^\s]+)/i)[1]
                    upstreamRef = releaseCommit.sha
                    upstreamUrl = releaseCommit.html_url
                  } else if (!upstreamVersion) {
                    core.setFailed('No upstream GitHub Release or release(dsh): commit was found.')
                    return
                  } else {
                    // No tag or release commit matches the npm version; pin to master HEAD.
                    const head = await github.rest.repos.getCommit({
                      owner: upstreamOwner,
                      repo: upstreamRepo,
                      ref: 'master',
                    })
                    upstreamRef = head.data.sha
                    upstreamUrl = head.data.html_url
                  }
                }
              }
            }

            if (!upstreamVersion) {
              const commit = await github.rest.repos.getCommit({
                owner: upstreamOwner,
                repo: upstreamRepo,
                ref: upstreamRef,
              })
              const firstLine = commit.data.commit.message.split('\n')[0]
              const match = firstLine.match(/^release\(dsh\):\s*([^\s]+)/i)
              upstreamVersion = match ? match[1] : upstreamRef
              upstreamUrl = commit.data.html_url
            }

            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            })

            const alreadyReleased = releases.some(release =>
              release.body?.includes(`上游版本：${upstreamVersion}`) ||
              release.body?.includes(`上游引用：${upstreamRef}`),
            )

            const stableVersions = releases
              .map(release => release.tag_name.match(/^v(\d+)\.(\d+)\.(\d+)$/))
              .filter(Boolean)
              .map(match => match.slice(1).map(Number))
              .sort((a, b) => a[0] - b[0] || a[1] - b[1] || a[2] - b[2])

            let dshPortVersion = forcedDshPortVersion.replace(/^v/, '')
            if (!dshPortVersion) {
              if (stableVersions.length === 0) {
                dshPortVersion = '0.1.0'
              } else {
                const latest = stableVersions.at(-1)
                dshPortVersion = `${latest[0]}.${latest[1]}.${latest[2] + 1}`
              }
            }

            const releaseTag = `v${dshPortVersion}`
            let tagExists = false
            try {
              await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag: releaseTag,
              })
              tagExists = true
            } catch (error) {
              if (error.status !== 404) throw error
            }

            core.setOutput('should_build', String(force || (!alreadyReleased && !tagExists)))
            core.setOutput('upstream_ref', upstreamRef)
            core.setOutput('upstream_version', upstreamVersion)
            core.setOutput('release_tag', releaseTag)
            core.setOutput('release_title', `DshPort ${releaseTag}`)
            core.setOutput('upstream_url', upstreamUrl)

  windows-x64:
    needs: detect-upstream
    if: needs.detect-upstream.outputs.should_build == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.14.0'
          cache: pnpm
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: node scripts/build-runtime.mjs
        env:
          DSH_SOURCE_REF: ${{ needs.detect-upstream.outputs.upstream_ref }}
          DSH_PACKAGE_VERSION: ${{ needs.detect-upstream.outputs.upstream_version }}
      - run: node scripts/package.mjs --zip
        env:
          DSHPORT_VERSION: ${{ needs.detect-upstream.outputs.release_tag }}
      - run: npm run smoke:package
      - uses: actions/upload-artifact@v4
        with:
          name: DshPort-win-x64
          path: |
            dist-exe/desktop/DshPort-win-x64.zip
            dist-exe/desktop/harness-runtime.zip
            dist-exe/desktop/SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.detect-upstream.outputs.release_tag }}
          name: ${{ needs.detect-upstream.outputs.release_title }}
          prerelease: false
          body: |
            DshPort Windows 便携版自动构建。

            上游项目：${{ needs.detect-upstream.outputs.upstream_url }}
            上游版本：${{ needs.detect-upstream.outputs.upstream_version }}
            上游引用：${{ needs.detect-upstream.outputs.upstream_ref }}

            下载说明：
            - DshPort-win-x64.zip：完整 Windows x64 便携包，首次使用下载这个
            - harness-runtime.zip：仅 Harness 运行时更新包，供后续增量更新使用
            - SHA256SUMS.txt：SHA-256 校验文件
          files: |
            dist-exe/desktop/DshPort-win-x64.zip
            dist-exe/desktop/harness-runtime.zip
            dist-exe/desktop/SHA256SUMS.txt
