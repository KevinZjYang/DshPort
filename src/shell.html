<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' http://127.0.0.1:*; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; frame-src http://127.0.0.1:*;">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>DshPort</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        font-family: "Segoe UI", system-ui, sans-serif;
        background: #0f1115;
      }

      body {
        display: grid;
        grid-template-rows: 40px 1fr;
      }

      .toolbar {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 0 10px;
        border-bottom: 1px solid #d7dbe3;
        background: #f7f8fa;
      }

      button {
        height: 28px;
        padding: 0 10px;
        border: 1px solid #c7ccd5;
        border-radius: 4px;
        color: #1f2937;
        background: #ffffff;
        font: inherit;
        font-size: 13px;
        cursor: pointer;
        white-space: nowrap;
      }

      button:hover {
        background: #eef2f7;
      }

      button:active {
        background: #e5eaf1;
      }

      .status {
        margin-left: auto;
        padding: 0 4px;
        font-size: 12px;
        color: #6b7280;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .status.ok {
        color: #15803d;
      }

      .status.warn {
        color: #b45309;
      }

      .progress {
        flex: 1;
        min-width: 120px;
        max-width: 320px;
        height: 6px;
        border-radius: 3px;
        background: #e5eaf1;
        overflow: hidden;
      }

      .progress-fill {
        height: 100%;
        width: 0%;
        background: #5b8def;
        border-radius: 3px;
        transition: width 0.2s ease;
      }

      .progress.indeterminate .progress-fill {
        width: 30%;
        animation: indeterminate 1.1s ease-in-out infinite;
      }

      @keyframes indeterminate {
        0% { margin-left: 0; }
        50% { margin-left: 40%; }
        100% { margin-left: 70%; }
      }

      iframe {
        width: 100%;
        height: 100%;
        border: 0;
        background: #ffffff;
      }

      .loading {
        grid-row: 2;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        color: #9aa4b2;
        font-size: 13px;
      }

      .loading[hidden] {
        display: none;
      }

      .spinner {
        width: 28px;
        height: 28px;
        border: 3px solid #2b303b;
        border-top-color: #5b8def;
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div class="toolbar">
      <button id="openLogs" type="button">打开日志目录</button>
      <button id="restart" type="button">重启 Harness</button>
      <button id="updates" type="button">检查更新</button>
      <button id="dataManage" type="button">数据管理</button>
      <button id="about" type="button">关于</button>
      <div id="progress" class="progress" hidden>
        <div id="progressFill" class="progress-fill"></div>
      </div>
      <span id="status" class="status"></span>
    </div>
    <div id="loading" class="loading">
      <div class="spinner"></div>
      <div>正在启动 DeepSeek Harness…</div>
    </div>
    <iframe id="harness" title="DeepSeek Harness" hidden></iframe>
    <script>
      const frame = document.getElementById('harness')
      const loading = document.getElementById('loading')
      const statusEl = document.getElementById('status')

      function loadUrl(url) {
        if (!url) return
        frame.src = url
        frame.hidden = false
        loading.hidden = true
      }

      // Fallback for direct loads with ?url=; normal flow delivers the URL via IPC.
      const initialUrl = new URLSearchParams(location.search).get('url')
      if (initialUrl) loadUrl(initialUrl)

      const progressEl = document.getElementById('progress')
      const progressFill = document.getElementById('progressFill')

      window.deepseekHarnessDesktop.onAppStatus(({ text, kind = 'info', percent }) => {
        statusEl.textContent = text
        statusEl.className = 'status ' + kind
        if (typeof percent === 'number') {
          progressEl.hidden = false
          if (percent >= 0) {
            progressEl.classList.remove('indeterminate')
            progressFill.style.width = Math.min(100, percent) + '%'
          } else {
            progressEl.classList.add('indeterminate')
          }
        } else {
          progressEl.hidden = true
          progressEl.classList.remove('indeterminate')
        }
      })

      document.getElementById('openLogs').addEventListener('click', () => {
        window.deepseekHarnessDesktop.openLogFolder()
      })
      document.getElementById('restart').addEventListener('click', async () => {
        loading.hidden = false
        frame.hidden = true
        frame.src = 'about:blank'
        statusEl.textContent = '正在重启 Harness…'
        statusEl.className = 'status info'
        progressEl.hidden = true
        progressEl.classList.remove('indeterminate')
        const url = await window.deepseekHarnessDesktop.restartHarness()
        if (url) loadUrl(url)
      })
      document.getElementById('updates').addEventListener('click', () => {
        window.deepseekHarnessDesktop.checkForUpdates()
      })
      document.getElementById('dataManage').addEventListener('click', () => {
        window.deepseekHarnessDesktop.dataManage()
      })
      document.getElementById('about').addEventListener('click', () => {
        window.deepseekHarnessDesktop.showAbout()
      })
      window.deepseekHarnessDesktop.onHarnessUrl(url => {
        loadUrl(url)
      })
    </script>
  </body>
</html>
