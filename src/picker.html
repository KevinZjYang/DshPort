<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>DshPort 数据管理</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        height: 100vh;
        display: flex;
        flex-direction: column;
        font-family: "Segoe UI", system-ui, sans-serif;
        font-size: 13px;
        color: #1f2937;
        background: #f7f8fa;
      }

      .header {
        padding: 16px 18px 12px;
        border-bottom: 1px solid #e2e6ee;
        background: #ffffff;
      }

      .title {
        font-size: 15px;
        font-weight: 600;
        margin-bottom: 6px;
      }

      .detail {
        color: #6b7280;
        font-size: 12px;
        line-height: 1.6;
        white-space: pre-line;
      }

      .list {
        flex: 1;
        overflow-y: auto;
        padding: 12px 18px;
      }

      .item {
        display: flex;
        gap: 10px;
        align-items: flex-start;
        padding: 10px 12px;
        border: 1px solid #e2e6ee;
        border-radius: 6px;
        background: #ffffff;
        margin-bottom: 8px;
        cursor: pointer;
      }

      .item:hover {
        border-color: #b9c6da;
      }

      .item input {
        margin-top: 2px;
        accent-color: #2f6fed;
      }

      .item .name {
        font-weight: 600;
      }

      .item .desc {
        color: #6b7280;
        font-size: 12px;
        margin-top: 2px;
        line-height: 1.5;
      }

      .item .size {
        margin-left: auto;
        color: #9aa4b2;
        font-size: 12px;
        white-space: nowrap;
      }

      .footer {
        display: flex;
        justify-content: flex-end;
        gap: 10px;
        padding: 12px 18px;
        border-top: 1px solid #e2e6ee;
        background: #ffffff;
      }

      button {
        height: 30px;
        padding: 0 16px;
        border: 1px solid #c7ccd5;
        border-radius: 4px;
        background: #ffffff;
        font: inherit;
        cursor: pointer;
      }

      button:hover {
        background: #eef2f7;
      }

      button.primary {
        background: #2f6fed;
        border-color: #2f6fed;
        color: #ffffff;
      }

      button.primary:hover {
        background: #265fd6;
      }

      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
    </style>
  </head>
  <body>
    <div class="header">
      <div class="title" id="title"></div>
      <div class="detail" id="detail"></div>
    </div>
    <div class="list" id="list"></div>
    <div class="footer">
      <button id="cancel" type="button">取消</button>
      <button id="ok" type="button" class="primary">确定</button>
    </div>
    <script>
      const state = { selected: new Set() }
      const $ = id => document.getElementById(id)

      function formatSize(bytes) {
        if (!bytes || bytes <= 0) return ''
        if (bytes < 1024) return bytes + ' B'
        const units = ['KB', 'MB', 'GB']
        let value = bytes / 1024
        let unit = units[0]
        for (let i = 1; i < units.length && value >= 1024; i += 1) {
          value /= 1024
          unit = units[i]
        }
        return value.toFixed(1) + ' ' + unit
      }

      function syncOk() {
        $('ok').disabled = state.selected.size === 0
      }

      async function init() {
        const options = await window.dshPicker.getOptions()
        if (!options) {
          window.close()
          return
        }
        $('title').textContent = options.title || '数据管理'
        $('detail').textContent = options.detail || ''
        const list = $('list')
        list.textContent = ''
        for (const category of options.categories || []) {
          const checked = options.mode === 'restore' || category.checked !== false
          if (checked) state.selected.add(category.id)
          const label = document.createElement('label')
          label.className = 'item'
          const box = document.createElement('input')
          box.type = 'checkbox'
          box.checked = checked
          box.addEventListener('change', () => {
            if (box.checked) state.selected.add(category.id)
            else state.selected.delete(category.id)
            syncOk()
          })
          const body = document.createElement('div')
          body.style.flex = '1'
          const name = document.createElement('div')
          name.className = 'name'
          name.textContent = category.label
          const desc = document.createElement('div')
          desc.className = 'desc'
          desc.textContent = category.description || ''
          body.append(name, desc)
          const size = document.createElement('span')
          size.className = 'size'
          size.textContent = formatSize(category.size || 0)
          label.append(box, body, size)
          list.append(label)
        }
        syncOk()
      }

      $('ok').addEventListener('click', async () => {
        await window.dshPicker.submit({ selected: [...state.selected] })
        window.close()
      })
      $('cancel').addEventListener('click', async () => {
        await window.dshPicker.submit({ canceled: true })
        window.close()
      })
      init()
    </script>
  </body>
</html>
